<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크로스핏 WOD 기록</title>
<style>
  body{font-family:sans-serif;padding:20px;max-width:600px;margin:auto;background:#fafafa;color:#222;}
  h2{margin-bottom:4px;}
  .nav{margin:16px 0;}
  .nav button{display:inline-block;padding:8px 16px;margin-right:8px;border:none;border-radius:6px;background:#eee;color:#333;font-size:15px;cursor:pointer;}
  .nav button.active{background:#4CAF50;color:white;}
  input[type=text]{font-size:16px;padding:8px;margin-right:8px;border:1px solid #ccc;border-radius:6px;}
  button.submit{font-size:16px;padding:8px 16px;background:#4CAF50;color:white;border:none;border-radius:6px;cursor:pointer;}
  table{width:100%;border-collapse:collapse;margin-top:16px;background:white;}
  th,td{border:1px solid #ddd;padding:8px;text-align:center;font-size:14px;}
  th{background:#4CAF50;color:white;}
  tr:nth-child(odd){background:#f9f9f9;}
  .total{font-size:18px;margin-top:12px;}
  .msg{color:#666;}
  .loading{color:#888;font-size:14px;}
</style>
</head>
<body>
  <h2>🏋️ 크로스핏 WOD 기록</h2>
  <div class="nav">
    <button id="btnLookup" class="active">내 기록 조회</button>
    <button id="btnClass">반별 순위</button>
  </div>
  <div id="content"><p class="loading">불러오는 중...</p></div>

<script>
// ===== 설정: 여기 두 링크만 나중에 바꾸면 됩니다 =====
var RESPONSE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQtszfqJJRbtOZAFk96SnrCYGDk6-YtjRApP8eBvwhs8A-HnFWtMsMOoAZqWIEUv1DIvwPHwgsNu2BN/pub?gid=933854400&single=true&output=csv";
var SESSION_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQtszfqJJRbtOZAFk96SnrCYGDk6-YtjRApP8eBvwhs8A-HnFWtMsMOoAZqWIEUv1DIvwPHwgsNu2BN/pub?gid=128671562&single=true&output=csv";

var BASE_POINT = 50;
var GRADE_BONUS = [50, 40, 30, 20, 10];

var COL_SESSION = "오늘의 크로스핏 차시";
var COL_STUDENT_ID = "학번";
var COL_NAME = "이름";
var COL_FOR_TIME = "오늘의 수행기록(FOR TIME)";
var COL_AMRAP = "오늘의 수행기록(AMRAP / EMOM)";

var currentView = 'lookup';
var responseRows = null;
var sessionInfo = null;

// ---- 간단한 CSV 파서 (따옴표 안의 콤마/줄바꿈 처리) ----
function parseCSV(text) {
  var rows = [];
  var row = [];
  var field = '';
  var inQuotes = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else { field += c; }
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

function csvToObjects(text) {
  var rows = parseCSV(text);
  if (rows.length === 0) return [];
  var headers = rows[0];
  var out = [];
  for (var i = 1; i < rows.length; i++) {
    if (rows[i].length === 1 && rows[i][0] === '') continue;
    var obj = {};
    for (var j = 0; j < headers.length; j++) obj[headers[j]] = rows[i][j] || '';
    out.push(obj);
  }
  return out;
}

function parseDuration(v) {
  if (!v) return null;
  var parts = v.toString().trim().split(':').map(Number);
  if (parts.some(isNaN)) return null;
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if (parts.length === 2) return parts[0]*60 + parts[1];
  return null;
}

function parseRoundsReps(v) {
  if (!v) return null;
  var m = v.toString().trim().match(/^(\d+)\+(\d+)$/);
  if (!m) return null;
  return { rounds: parseInt(m[1],10), reps: parseInt(m[2],10) };
}

function getClassFromId(id) {
  var s = (id || '').toString().trim();
  if (s.length !== 5) return '알수없음';
  return s.substring(1,3) + '반';
}

function getGrade(rank, total) {
  var g = Math.ceil(rank * 5 / total);
  if (g < 1) g = 1;
  if (g > 5) g = 5;
  return g;
}

function getRankingData(session) {
  var recordType = sessionInfo.info[session];
  var rows = [];
  responseRows.forEach(function(r) {
    var rowSession = (r[COL_SESSION] || '').trim();
    if (rowSession !== session) return;
    var studentId = (r[COL_STUDENT_ID] || '').trim();
    if (!studentId) return;
    var entry = { studentId: studentId, name: r[COL_NAME], class: getClassFromId(studentId) };
    if (recordType === '시간') {
      var sec = parseDuration(r[COL_FOR_TIME]);
      if (sec === null || sec === 0) return;
      entry.seconds = sec;
      entry.display = r[COL_FOR_TIME];
    } else if (recordType === '반복수') {
      var rr = parseRoundsReps(r[COL_AMRAP]);
      if (!rr) return;
      entry.rounds = rr.rounds;
      entry.reps = rr.reps;
      entry.display = rr.rounds + '라운드 + ' + rr.reps + '개';
    } else { return; }
    rows.push(entry);
  });
  if (recordType === '시간') rows.sort(function(a,b){ return a.seconds - b.seconds; });
  else if (recordType === '반복수') rows.sort(function(a,b){ if (b.rounds!==a.rounds) return b.rounds-a.rounds; return b.reps-a.reps; });
  return rows;
}

function computeAllStudentScores() {
  var students = {};
  sessionInfo.order.forEach(function(session) {
    var ranked = getRankingData(session);
    var n = ranked.length;
    ranked.forEach(function(r, idx) {
      var rank = idx + 1;
      var grade = getGrade(rank, n);
      var point = BASE_POINT + GRADE_BONUS[grade-1];
      var key = r.studentId;
      if (!students[key]) students[key] = { studentId: r.studentId, name: r.name, class: r.class, total: 0, count: 0, records: [] };
      students[key].total += point;
      students[key].count += 1;
      students[key].records.push({ session: session, display: r.display, rank: rank, sessionTotal: n, grade: grade, point: point });
    });
  });

  // 전체 학생 누적 점수 기준 순위 계산
  var list = Object.keys(students).map(function(k){ return students[k]; });
  list.sort(function(a,b){ return b.total - a.total; });
  var overallTotal = list.length;
  list.forEach(function(s, idx) {
    s.overallRank = idx + 1;
    s.overallTotalStudents = overallTotal;
  });

  return students;
}

function escapeHtml(s) {
  return (s || '').toString().replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderLookup(studentId) {
  var el = document.getElementById('content');
  var html = '<form id="lookupForm"><input type="text" id="idInput" placeholder="학번 5자리 입력" value="' + escapeHtml(studentId||'') + '"><button type="submit" class="submit">조회</button></form>';
  if (!studentId) {
    html += '<p class="msg">본인 학번(5자리)을 입력하면 나의 기록만 확인할 수 있어요.</p>';
  } else {
    var students = computeAllStudentScores();
    var s = students[studentId.trim()];
    if (!s) {
      html += '<p class="msg">해당 학번의 기록을 찾을 수 없어요. 학번을 다시 확인해주세요.</p>';
    } else {
      var rowsHtml = s.records.map(function(r) {
        return '<tr><td>' + escapeHtml(r.session) + '</td><td>' + escapeHtml(r.display) + '</td><td>' + r.rank + '위 / ' + r.sessionTotal + '명</td><td>' + r.grade + '등급</td><td>' + r.point + '점</td></tr>';
      }).join('');
      html += '<h3>' + escapeHtml(s.name) + ' 학생 (' + s.class + ')</h3>'
        + '<table><tr><th>차시</th><th>기록</th><th>순위</th><th>등급</th><th>점수</th></tr>' + rowsHtml + '</table>'
        + '<p class="total">누적 점수: <b>' + s.total + '점</b> (참여 ' + s.count + '회)</p>'
        + '<p class="total">전체 누적 순위: <b>' + s.overallRank + '위</b> / ' + s.overallTotalStudents + '명 중</p>';
    }
  }
  el.innerHTML = html;
  document.getElementById('lookupForm').addEventListener('submit', function(e) {
    e.preventDefault();
    renderLookup(document.getElementById('idInput').value);
  });
}

function renderClass() {
  var el = document.getElementById('content');
  var students = computeAllStudentScores();
  var classTotals = {};
  Object.keys(students).forEach(function(key) {
    var s = students[key];
    if (!classTotals[s.class]) classTotals[s.class] = { sum: 0, count: 0 };
    classTotals[s.class].sum += s.total;
    classTotals[s.class].count += 1;
  });
  var list = Object.keys(classTotals).map(function(cls) {
    var avg = classTotals[cls].sum / classTotals[cls].count;
    return { class: cls, avg: Math.round(avg*10)/10 };
  });
  list.sort(function(a,b){ return b.avg - a.avg; });
  var rowsHtml = list.map(function(r, idx) {
    return '<tr><td>' + (idx+1) + '</td><td>' + r.class + '</td><td>' + r.avg + '점</td></tr>';
  }).join('');
  el.innerHTML = '<table><tr><th>순위</th><th>반</th><th>평균 점수</th></tr>' + rowsHtml + '</table>';
}

function render() {
  document.getElementById('btnLookup').className = currentView === 'lookup' ? 'active' : '';
  document.getElementById('btnClass').className = currentView === 'class' ? 'active' : '';
  if (currentView === 'lookup') renderLookup('');
  else renderClass();
}

document.getElementById('btnLookup').addEventListener('click', function(){ currentView='lookup'; render(); });
document.getElementById('btnClass').addEventListener('click', function(){ currentView='class'; render(); });

function loadSessionInfo(text) {
  var rows = csvToObjects(text);
  var info = {}, order = [];
  rows.forEach(function(r) {
    var name = (r['차시'] || '').trim();
    var type = (r['기록방식'] || '').trim();
    if (name) { info[name] = type; order.push(name); }
  });
  return { info: info, order: order };
}

Promise.all([
  fetch(RESPONSE_CSV_URL).then(function(r){ return r.text(); }),
  fetch(SESSION_CSV_URL).then(function(r){ return r.text(); })
]).then(function(results) {
  responseRows = csvToObjects(results[0]);
  sessionInfo = loadSessionInfo(results[1]);
  render();
}).catch(function(err) {
  document.getElementById('content').innerHTML = '<p class="msg">데이터를 불러오지 못했어요. 인터넷 연결을 확인해주세요.<br><small>' + escapeHtml(err.message) + '</small></p>';
});
</script>
</body>
</html>

  fetch(SESSION_CSV_URL).then(function(r){ return r.text(); })
]).then(function(results) {
  responseRows = csvToObjects(results[0]);
  sessionInfo = loadSessionInfo(results[1]);
  render();
}).catch(function(err) {
  document.getElementById('content').innerHTML = '<p class="msg">데이터를 불러오지 못했어요. 인터넷 연결을 확인해주세요.<br><small>' + escapeHtml(err.message) + '</small></p>';
});
</script>
